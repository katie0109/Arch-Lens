name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage (builds run first, so CLI E2E hits the built binary)
        run: pnpm coverage

      - name: Consumer smoke test (packed tarballs installed into a clean project)
        run: bash scripts/consumer-smoke.sh

      - name: Architecture scan
        run: |
          mkdir -p reports
          pnpm --filter arch-lens-cli exec -- node dist/index.js scan examples/monorepo-sample/src --report json --allow-violations > reports/arch-lens-report.json

      - name: Upload coverage artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

      - name: Upload arch-lens report
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: arch-lens-report
          path: reports/arch-lens-report.json
          if-no-files-found: warn
